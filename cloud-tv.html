<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>BẢNG GIÁ NET - TV DISPLAY</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background-color: #0b0f19; color: #ffffff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; padding: 4vh 5vw; }
        header { text-align: center; margin-bottom: 5vh; }
        header h1 { font-size: 3.8rem; color: #00ffcc; letter-spacing: 2px; text-shadow: 0 0 25px rgba(0, 255, 204, 0.7); font-weight: 800; }
        .container { display: flex; justify-content: center; gap: 40px; flex: 1; margin-bottom: 4vh; align-items: center; }
        .zone-card { flex: 1; max-width: 500px; background: linear-gradient(145deg, #131a2e, #0d1527); border: 2px solid #1e294b; border-radius: 20px; padding: 40px; display: flex; flex-direction: column; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6); }
        .zone-title { font-size: 2.8rem; font-weight: bold; margin-bottom: 35px; padding-bottom: 15px; border-bottom: 3px solid #1e294b; color: #38bdf8; text-align: center; text-transform: uppercase; }
        .price-box { background: rgba(0, 0, 0, 0.3); border-radius: 12px; padding: 25px; }
        .price-row { display: flex; justify-content: space-between; font-size: 2rem; margin-bottom: 20px; align-items: center; color: #cbd5e1; }
        .price-row:last-child { margin-bottom: 0; }
        .price-label { font-weight: 500; }
        .price-value { font-weight: 800; color: #ffffff; }
        .price-value span { font-size: 3.5rem; color: #00ffcc; font-style: italic; }
        footer { text-align: center; color: #ff0055; font-size: 1.8rem; border-top: 2px solid #1e294b; padding-top: 2vh; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1 id="bar-name">⚡ CYBER GAME IFUN ⚡</h1>
    </header>

    <div class="container" id="card-container"></div>

    <footer>
        <marquee id="bar-footer" scrollamount="6">Chào mừng quý khách đến với IFUN Cyber Game!</marquee>
    </footer>

    <script>
        async function pullData() {
            try {
                const response = await fetch('./data.json?t=' + new Date().getTime());
                if (!response.ok) return;
                const db = await response.json();
                
                const urlParams = new URLSearchParams(window.location.search);
                const barId = urlParams.get('id') || '1'; 
                const barData = db[barId];

                if(barData) {
                    document.getElementById('bar-name').innerText = barData.name;
                    document.getElementById('bar-footer').innerText = barData.footer;

                    let htmlContent = '';
                    barData.zones.forEach(zone => {
                        htmlContent += `
                            <div class="zone-card">
                                <div class="zone-title">${zone.name}</div>
                                <div class="price-box">
                                    <div class="price-row">
                                        <span class="price-label">Khách vãng lai:</span>
                                        <div class="price-value"><span>${zone.price1}</span> đ/h</div>
                                    </div>
                                    <div class="price-row">
                                        <span class="price-label">Hội viên:</span>
                                        <div class="price-value"><span>${zone.price2}</span> đ/h</div>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    document.getElementById('card-container').innerHTML = htmlContent;
                }
            } catch (error) { console.log(error); }
        }

        pullData();
        setInterval(pullData, 15000);
    </script>
</body>
</html>
