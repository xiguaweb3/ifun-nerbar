<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Bảng Giá Quán Net - Local Admin</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; padding: 30px; color: #333; }
        .admin-box { max-width: 650px; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin: 0 auto; }
        h2 { text-align: center; color: #1e293b; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #64748b; margin-bottom: 25px; font-size: 0.95rem; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #475569; }
        select, input, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        .zone-edit { border: 1px solid #e2e8f0; padding: 15px; margin-bottom: 15px; border-radius: 6px; background: #f8fafc; }
        .zone-title { font-weight: bold; color: #0f766e; margin-bottom: 10px; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; }
        .price-inputs { display: flex; gap: 15px; }
        .price-inputs div { flex: 1; }
        button { width: 100%; background: #10b981; color: white; padding: 14px; border: none; border-radius: 6px; font-size: 1.1rem; cursor: pointer; font-weight: bold; transition: background 0.2s; margin-bottom: 15px; }
        button:hover { background: #059669; }
        .json-output { background: #1e293b; color: #00ffcc; padding: 15px; border-radius: 6px; font-family: monospace; display: none; white-space: pre-wrap; word-break: break-all; margin-top: 15px; }
    </style>
</head>
<body>

<div class="admin-box">
    <h2>🌐 HỆ THỐNG CẬP NHẬT GIÁ MỚI</h2>
    <p class="subtitle">Bảng điều khiển tạo dữ liệu giá (Bản Việt Nam)</p>
    
    <div class="form-group">
        <label>Chọn chi nhánh để sửa (选择网吧分店):</label>
        <select id="bar-select" onchange="switchBar()">
            <option value="1">Chi nhánh 1 (Hà Nội)</option>
            <option value="2">Chi nhánh 2 (TP.HCM)</option>
            <option value="3">Chi nhánh 3 (Đà Nẵng)</option>
        </select>
    </div>

    <div class="form-group">
        <label>Tên quán Net (网吧分店名称):</label>
        <input type="text" id="bar-name">
    </div>

    <div id="zones-container"></div>

    <div class="form-group">
        <label>Thông báo chạy chữ ở dưới TV (底部活动通知):</label>
        <textarea id="bar-footer" rows="2"></textarea>
    </div>

    <button onclick="generateData()">📋 BẤM VÀO ĐÂY ĐỂ COPPY DỮ LIỆU MỚI</button>
    
    <div id="output-area" style="display:none;">
        <label style="color: #e11d48; font-weight: bold;">👉 Bước tiếp theo (下一步):</label>
        <p style="font-size:0.9rem; color:#475569; margin-bottom: 10px;">Dữ liệu đã được tự động copy! Vui lòng mở file <b>data.json</b> trên GitHub của bạn, bấm Sửa (Edit) rồi Dán (Paste) đè lên toàn bộ dữ liệu cũ và lưu lại là xong!</p>
        <div id="json-box" class="json-output"></div>
    </div>
</div>

<script>
// 基础架构数据
let globalDatabase = {
    "1": { "name": "⚡ CYBER GAME IFUN (HÀ NỘI) ⚡", "footer": "Khuyến mãi: Nạp 100k tặng 50k! Nghiêm cấm người dưới 18 tuổi.", "zones": [{ "name": "Khu Máy Thường", "price1": "6.000", "price2": "5.000" }, { "name": "Khu VIP Box", "price1": "15.000", "price2": "12.000" }] },
    "2": { "name": "⚡ CYBER GAME IFUN (TP.HCM) ⚡", "footer": "Chào mừng quý khách! Chúc các bạn chơi game vui vẻ.", "zones": [{ "name": "Khu Standard", "price1": "7.000", "price2": "6.000" }, { "name": "Khu VIP Pro", "price1": "18.000", "price2": "14.000" }] },
    "3": { "name": "⚡ CYBER GAME IFUN (ĐÀ NẴNG) ⚡", "footer": "Giảm giá 20% cho học sinh sinh viên mang theo thẻ.", "zones": [{ "name": "Khu Gaming", "price1": "8.000", "price2": "6.500" }] }
};

// 尝试从你本地在线的 data.json 预加载最新配置（如果没有，则用上面的默认配置）
async function initAdmin() {
    try {
        const res = await fetch('./data.json?t=' + new Date().getTime());
        if(res.ok) globalDatabase = await res.json();
    } catch(e) {}
    switchBar();
}

function switchBar() {
    const id = document.getElementById('bar-select').value;
    const bar = globalDatabase[id];
    document.getElementById('bar-name').value = bar.name;
    document.getElementById('bar-footer').value = bar.footer;

    const container = document.getElementById('zones-container');
    container.innerHTML = '';
    bar.zones.forEach((zone, index) => {
        container.innerHTML += `
            <div class="zone-edit">
                <div class="zone-title">${zone.name}</div>
                <div class="price-inputs">
                    <div>
                        <label style="font-size:0.85rem; color:#64748b;">Khách vãng lai</label>
                        <input type="text" id="p1-${index}" value="${zone.price1}">
                    </div>
                    <div>
                        <label style="font-size:0.85rem; color:#64748b;">Hội viên</label>
                        <input type="text" id="p2-${index}" value="${zone.price2}">
                    </div>
                </div>
            </div>
        `;
    });
}

function generateData() {
    const id = document.getElementById('bar-select').value;
    globalDatabase[id].name = document.getElementById('bar-name').value;
    globalDatabase[id].footer = document.getElementById('bar-footer').value;
    globalDatabase[id].zones.forEach((zone, index) => {
        zone.price1 = document.getElementById(`p1-${index}`).value;
        zone.price2 = document.getElementById(`p2-${index}`).value;
    });

    const jsonStr = JSON.stringify(globalDatabase, null, 2);
    document.getElementById('json-box').innerText = jsonStr;
    document.getElementById('output-area').style.display = 'block';
    document.getElementById('json-box').style.display = 'block';

    // 自动复制到剪贴板
    navigator.clipboard.writeText(jsonStr).then(() => {
        alert("Đã Copy thành công dữ liệu mới vào bộ nhớ tạm!");
    }).catch(() => {
        alert("Vui lòng bôi đen sao chép khung màu xanh ở dưới!");
    });
}
initAdmin();
</script>
</body>
</html>
