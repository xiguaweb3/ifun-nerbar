<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Bảng Giá Quán Net - Cloud Admin</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; padding: 30px; color: #333; }
        .admin-box { max-width: 650px; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin: 0 auto; }
        h2 { text-align: center; color: #1e293b; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #64748b; margin-bottom: 25px; font-size: 0.95rem; }
        .status-bar { text-align: center; padding: 8px; margin-bottom: 20px; border-radius: 4px; font-size: 0.9rem; font-weight: bold; }
        .status-load { background: #e0f2fe; color: #0369a1; }
        .status-success { background: #dcfce7; color: #15803d; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #475569; }
        select, input, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        .zone-edit { border: 1px solid #e2e8f0; padding: 15px; margin-bottom: 15px; border-radius: 6px; background: #f8fafc; }
        .zone-title { font-weight: bold; color: #0f766e; margin-bottom: 10px; border-bottom: 1px solid #e2e8f0; padding-bottom: 5px; }
        .price-inputs { display: flex; gap: 15px; }
        .price-inputs div { flex: 1; }
        button { width: 100%; background: #2563eb; color: white; padding: 14px; border: none; border-radius: 6px; font-size: 1.1rem; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background: #1d4ed8; }
        .tips { margin-top: 15px; font-size: 0.85rem; color: #64748b; text-align: center; }
    </style>
</head>
<body>

<div class="admin-box">
    <h2>🌐 HỆ THỐNG QUẢN LÝ BẢNG GIÁ</h2>
    <p class="subtitle">云端多店网吧价目管理后台 (Bản Việt Nam)</p>
    <div id="status" class="status-bar status-load">Đang kết nối cơ sở dữ liệu cloud...</div>
    
    <div class="form-group">
        <label>Chọn chi nhánh (选择网吧分店):</label>
        <select id="bar-select" onchange="switchBar()">
            <option value="1">Chi nhánh 1 (分店 1 - Hà Nội)</option>
            <option value="2">Chi nhánh 2 (分店 2 - HCM)</option>
            <option value="3">Chi nhánh 3 (分店 3 - Đà Nẵng)</option>
        </select>
    </div>

    <div class="form-group">
        <label>Tên quán Net (网吧分店名称):</label>
        <input type="text" id="bar-name">
    </div>

    <div id="zones-container"></div>

    <div class="form-group">
        <label>Thông báo chạy chữ ở dưới TV (底部活动通知):</label>
        <textarea id="bar-footer" rows="2"></textarea>
    </div>

    <button onclick="saveToCloud()">☁️ LƯU THAY ĐỔI & ĐỒNG BỘ TV</button>
    <div class="tips">Sau khi bấm Lưu, tivi ở các chi nhánh sẽ tự động cập nhật giá mới trong vòng 5秒.</div>
</div>

<script>
// 使用高速免签跨域专线
const DATA_KEY = "ifun_netbar_vietnam_database_v2";
const API_URL = `https://kv.rest{DATA_KEY}`;

let globalDatabase = {
    "1": { name: "⚡ CYBER GAME IFUN (HÀ NỘI) ⚡", footer: "Khuyến mãi: Nạp 100k tặng 50k! Nghiêm cấm người dưới 18 tuổi.", zones: [{ name: "Khu Máy Thường", price1: "6.000", price2: "5.000" }, { name: "Khu VIP Box", price1: "15.000", price2: "12.000" }] },
    "2": { name: "⚡ CYBER GAME IFUN (TP.HCM) ⚡", footer: "Chào mừng quý khách! Chúc các bạn chơi game vui vẻ.", zones: [{ name: "Khu Standard", price1: "7.000", price2: "6.000" }, { name: "Khu VIP Pro", price1: "18.000", price2: "14.000" }] },
    "3": { name: "⚡ CYBER GAME IFUN (ĐÀ NẴNG) ⚡", footer: "Giảm giá 20% cho học sinh sinh viên mang theo thẻ.", zones: [{ name: "Khu Gaming", price1: "8.000", price2: "6.500" }] }
};

async function loadFromCloud() {
    try {
        const response = await fetch(API_URL);
        if (response.ok) {
            const dataText = await response.text();
            if (dataText && dataText !== "null") {
                globalDatabase = JSON.parse(dataText);
                showStatus("Đã kết nối Cloud. Dữ liệu đã đồng bộ!", "success");
            } else {
                await uploadToCloud(globalDatabase);
                showStatus("Khởi tạo database mới thành công!", "success");
            }
        }
        switchBar();
    } catch (error) {
        showStatus("Lỗi kết nối. Đang dùng dữ liệu tạm thời!", "load");
        switchBar();
    }
}

function switchBar() {
    const id = document.getElementById('bar-select').value;
    const bar = globalDatabase[id];
    if(!bar) return;

    document.getElementById('bar-name').value = bar.name;
    document.getElementById('bar-footer').value = bar.footer;

    const container = document.getElementById('zones-container');
    container.innerHTML = '';

    bar.zones.forEach((zone, index) => {
        container.innerHTML += `
            <div class="zone-edit">
                <div class="zone-title">${zone.name}</div>
                <div class="price-inputs">
                    <div>
                        <label style="font-size:0.85rem; color:#64748b;">Khách vãng lai (临时)</label>
                        <input type="text" id="p1-${index}" value="${zone.price1}">
                    </div>
                    <div>
                        <label style="font-size:0.85rem; color:#64748b;">Hội viên (会员)</label>
                        <input type="text" id="p2-${index}" value="${zone.price2}">
                    </div>
                </div>
            </div>
        `;
    });
}

async function saveToCloud() {
    showStatus("Đang tải dữ liệu lên cloud...", "load");
    const id = document.getElementById('bar-select').value;
    
    globalDatabase[id].name = document.getElementById('bar-name').value;
    globalDatabase[id].footer = document.getElementById('bar-footer').value;

    globalDatabase[id].zones.forEach((zone, index) => {
        zone.price1 = document.getElementById(`p1-${index}`).value;
        zone.price2 = document.getElementById(`p2-${index}`).value;
    });

    const success = await uploadToCloud(globalDatabase);
    if(success) {
        showStatus("✨ Lưu thành công! Tất cả TV đã được đồng bộ.", "success");
        alert('Lưu thành công!');
    } else {
        showStatus("Lỗi lưu dữ liệu!", "load");
    }
}

async function uploadToCloud(data) {
    try {
        const response = await fetch(API_URL, {
            method: 'POST',
            body: JSON.stringify(data)
        });
        return response.ok;
    } catch (e) { return false; }
}

function showStatus(text, type) {
    const el = document.getElementById('status');
    el.innerText = text;
    el.className = `status-bar status-${type}`;
}
loadFromCloud();
</script>
</body>
</html>
